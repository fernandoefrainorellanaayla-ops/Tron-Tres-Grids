name: Android APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generar versión móvil
        run: python3 tools/build.py
      - name: Capacitor Android
        working-directory: build/mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
      - name: Compilar APK de depuración
        working-directory: build/mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: tron-las-grids-debug-apk, path: build/mobile/android/app/build/outputs/apk/debug/*.apk }
